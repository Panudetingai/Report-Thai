[package]
name = "tr-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tr-mcp"
path = "src/main.rs"

[dependencies]
tr-core = { path = "../tr-core" }
tr-pdf = { path = "../tr-pdf" }
tr-text = { path = "../tr-text" }
# MCP SDK ทางการ (Apache-2.0)
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
# แปลง PDF เป็น PNG สำหรับ preview_template (pure Rust, MIT/Apache-2.0)
hayro = "0.8"
