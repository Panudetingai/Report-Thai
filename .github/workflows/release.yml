# Release: push tag v* (เช่น v0.1.0-beta.1) → build ไบนารี 3 แพลตฟอร์ม แนบไว้ใน GitHub Release (สถานะ draft)
#
# แต่ละชุดมี: tr-mcp (MCP server), thaireport (CLI), tr-server (HTTP API) + fonts/ + templates/
# แตกไฟล์แล้วใช้ได้ทันที — tr-mcp และ thaireport หา fonts/ และ templates/ ข้างไฟล์โปรแกรมเอง
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# release ถูกสร้างเป็น draft ให้ตรวจ/เขียนรายละเอียดก่อนกด Publish เอง
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: test ก่อนออก release
        run: cargo test --workspace --exclude tr-node
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p tr-mcp -p tr-cli -p tr-server
      - name: รวมชุดไฟล์
        shell: bash
        run: |
          name="thaireport-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in tr-mcp thaireport tr-server; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "dist/$name/"
          done
          cp -R fonts templates "dist/$name/"
          rm -f "dist/$name"/templates/*.pdf
          cp LICENSE-MIT crates/tr-mcp/README.md "dist/$name/"
          mv "dist/$name/README.md" "dist/$name/MCP-README.md"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - name: ตรวจว่าชุดที่แตกแล้วใช้ได้ (render ตัวอย่างจากโฟลเดอร์อื่น)
        shell: bash
        run: |
          dir="$PWD/dist/thaireport-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cd "$RUNNER_TEMP"
          "$dir/thaireport${{ matrix.ext }}" render "$dir/templates/receipt.json" "$dir/templates/receipt.data.json" -o smoke.pdf
          head -c 4 smoke.pdf | grep -q '%PDF'
      - uses: actions/upload-artifact@v4
        with:
          name: thaireport-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
