# CI: เทสต์ทุกส่วนทุกครั้งที่ push / เปิด PR
# - rust: engine, CLI, HTTP API, MCP (ทั้ง Linux/macOS/Windows — release ออกทั้งสามแพลตฟอร์ม)
# - wasm-designer: build WASM → PDF จาก WASM ต้องตรงกับ native ทุกไบต์ → เทสต์และ build designer
# - node: addon @thaireport/node
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (ยกเว้น tr-node ซึ่งทดสอบผ่าน npm ใน job node)
        run: cargo test --workspace --exclude tr-node

  wasm-designer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/designer/package-lock.json
      - name: build WASM (web + node)
        run: ./scripts/build-wasm.sh
      - name: designer — ติดตั้ง
        working-directory: packages/designer
        run: npm ci
      - name: WASM ↔ native ได้ PDF ตรงกัน
        run: cargo test -p tr-pdf wasm_native_pdf_parity -- --ignored
      - name: designer — typecheck
        working-directory: packages/designer
        run: npm run typecheck
      # build ก่อนเทสต์: prebuild คัดลอก WASM ไป public/tr-wasm ที่เทสต์พรีวิวใช้
      - name: designer — build
        working-directory: packages/designer
        run: npm run build
      - name: designer — เทสต์
        working-directory: packages/designer
        run: npm test
      - name: "@thaireport/react — ติดตั้ง (npm workspaces) + เทสต์"
        run: npm ci && npm test
      - name: ตัวอย่าง Next.js — ติดตั้งจากแพ็กเกจที่ pack แล้ว + build
        working-directory: examples/nextjs-quickstart
        run: npm run pack:local && npm install && npm run build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build addon
        working-directory: packages/node
        run: npm run build
      - name: test
        working-directory: packages/node
        run: npm test
