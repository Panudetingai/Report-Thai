[workspace]
members = [
  "crates/tr-core",
  "crates/tr-text",
  "crates/tr-pdf",
  "crates/tr-thai",
  "crates/tr-etax",
  "crates/tr-wasm",
  "crates/tr-server",
  "crates/tr-cli",
  "crates/tr-mcp",
  "crates/tr-node",
]
resolver = "2"

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ThaiReport Contributors"]
